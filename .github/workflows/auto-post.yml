name: Binance Square - Five Coin Batches

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish up to five REAL image posts? Default = five previews only"
        required: false
        type: boolean
        default: false
  schedule:
    # Four batches per day, UTC cron to avoid timezone parsing ambiguity:
    # 07:37 / 13:37 / 19:37 / 01:37 Vietnam time.
    - cron: "37 0,6,12,18 * * *"
  push:
    paths:
      - "automation/binance-five-batch-trigger.txt"
      - "binance_batch.py"
      - "tests/test_binance_batch.py"
      - ".github/workflows/auto-post.yml"

permissions:
  contents: read

concurrency:
  group: binance-five-batch-publisher
  cancel-in-progress: false

jobs:
  test_only:
    name: Offline tests (no publishing)
    if: ${{ github.event_name == 'push' && github.event.head_commit.message != 'trigger:binance-5post-preview' && github.event.head_commit.message != 'trigger:binance-5post-publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13"
      - run: python -m unittest discover -s tests -p "test_binance_batch.py" -v

  publish_batch:
    name: Five different coins, at least one minute apart
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'trigger:binance-5post-preview' || github.event.head_commit.message == 'trigger:binance-5post-publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && github.event.head_commit.message == 'trigger:binance-5post-publish') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"

      - name: Run batch safety tests
        run: python -m unittest discover -s tests -p "test_binance_batch.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore previous successful post history
        uses: actions/cache/restore@v4
        with:
          path: data/history.json
          key: square-image-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            square-image-history-v1-

      - name: Download official Binance Square image publisher
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git

      - name: Identify trigger and authorization
        run: |
          echo "TRIGGER_EVENT=${{ github.event_name }}"
          echo "PUBLISH=$PUBLISH"
          echo "RUN_ID=${{ github.run_id }}"
          echo "BATCH_SIZE=5, DAILY_BATCHES=4, GAP_SECONDS=60"

      - name: Produce up to five unique coin image posts
        run: python -u binance_batch.py

      - name: Save updated post history (also on partial failures)
        if: always() && env.PUBLISH == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/history.json
          key: square-image-history-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the five generated images as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-coin-images-${{ github.run_id }}
          path: output/market_card_*.png
          retention-days: 3
          if-no-files-found: ignore

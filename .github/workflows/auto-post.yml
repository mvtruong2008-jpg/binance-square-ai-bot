name: Binance Square AI Bot - Image Edition

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish one real image post? (unchecked = preview only)"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "7,37 * * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read

concurrency:
  group: binance-square-image-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      # Scheduled runs publish; manually triggered runs preview unless publish box ticked.
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore post history
        uses: actions/cache/restore@v4
        with:
          path: data/history.json
          key: square-image-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            square-image-history-v1-

      - name: Download official Binance Square publisher
        run: git clone --depth 1 https://github.com/binance/binance-skills-hub.git

      - name: Generate card and optionally publish image post
        run: python bot.py

      - name: Save history after publishing
        if: success() && env.PUBLISH == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/history.json
          key: square-image-history-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save image preview as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-card-${{ github.run_id }}
          path: output/market_card.png
          retention-days: 3
          if-no-files-found: ignore

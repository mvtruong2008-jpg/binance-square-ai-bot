name: Threads Trend Bot - Drafts Only

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: "public = Google Trends, RSS news and Hacker News (no Meta token); demo; api (Meta approval)"
        type: choice
        required: true
        options:
          - public
          - demo
          - api
        default: public
  push:
    branches:
      - main
    paths:
      - "threads-trend-bot/**"
      - ".github/workflows/threads-trend-drafts.yml"
  schedule:
    # Four daily keyless public research windows; no Meta authorization needed.
    - cron: "19 1,7,13,19 * * *"

permissions:
  contents: read

concurrency:
  group: threads-trend-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft_preview:
    name: Create Vietnamese drafts without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline safety tests
        run: python -m unittest discover -s threads-trend-bot/tests -v

      - name: Research trends and generate draft files
        env:
          SOURCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_mode || 'public' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python threads-trend-bot/trend_bot.py --source "$SOURCE_MODE"

      - name: Upload draft files (not posted to Threads)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: threads-drafts-${{ github.run_id }}
          path: threads-trend-bot/output/
          if-no-files-found: error
          retention-days: 3
